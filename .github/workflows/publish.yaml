name: Publish

on:
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish-gimmegit
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Build package
        run: uv build
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  start-next-dev:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Bump package version
        run: uv run --script .github/scripts/bump_version_dev.py
      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(uvx --from "$PWD" gimmegit --version)"
          version="${version#gimmegit }"
          git checkout -b "bump-to-$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "bump version to $version"
          git push origin "bump-to-$version"
          gh pr create --base main --head "bump-to-$version" \
            --title "chore: bump version to $version" \
            --reviewer dwilding
