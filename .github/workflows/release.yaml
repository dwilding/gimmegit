name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Check version
        id: check
        run: |
          set -euo pipefail
          version="$(uvx --from "$PWD" gimmegit --version)"
          version="${version#gimmegit }"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! gh release view "$version" >/dev/null 2>&1; then
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wait-checks:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.wait.outputs.release }}
    steps:
      - name: Wait for checks
        id: wait
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          release=false
          # Wait for all other workflow runs on this SHA to complete.
          other_runs="$(gh run list --branch main --limit 50 --json databaseId,headSha --jq ".[] | select(.headSha == \"${sha}\") | .databaseId")"
          other_runs="$(echo "$other_runs" | grep -v "${{ github.run_id }}" || true)"
          all_passed=true
          for run in $other_runs; do
            if ! gh run watch "$run" --exit-status >/dev/null 2>&1; then
              all_passed=false
            fi
          done
          if [[ "$all_passed" == "true" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-draft:
    runs-on: ubuntu-latest
    needs: wait-checks
    if: needs.wait-checks.outputs.release == 'true'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Create draft release
        id: draft
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # Fetch merged PRs since the latest release.
          latest_tag="$(gh release list -L 1 --json tagName -q '.[0].tagName')"
          release_date="$(gh api "repos/${{ github.repository }}/releases/tags/${latest_tag}" --jq '.created_at')"
          prs_json="$(gh pr list --state merged --base main --json number,title --search "merged:>${release_date}" --limit 50)"
          # Group PRs by prefix, sorted by breaking then by PR number.
          prefixes=("feat:" "fix:" "revert:" "perf:" "docs:")
          entries=""
          for prefix in "${prefixes[@]}"; do
            breaking_prefix="${prefix%%:}!:"
            group="$(echo "$prs_json" | jq --arg p "$prefix" --arg bp "$breaking_prefix" '[.[] | select(.title | startswith($p) or startswith($bp))] | sort_by([if .title | startswith($bp) then 0 else 1 end, .number])')"
            count="$(echo "$group" | jq 'length')"
            for i in $(seq 0 $((count - 1))); do
              title="$(echo "$group" | jq -r ".[$i].title")"
              number="$(echo "$group" | jq -r ".[$i].number")"
              entries+="- ${title} (#${number})"$'\n'
            done
          done
          # Create the release.
          if [[ -z "$entries" ]]; then
            body="This is a maintenance release with no fixes or new features."
          else
            body="$entries"
          fi
          gh release create "$version" --draft --target main --notes "$body"
