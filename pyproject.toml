[project]
name = "gimmegit"
version = "4.0.1.dev0"
description = "A tool for cloning GitHub repos and creating branches."
authors = [
    { name = "Dave Wilding", email = "tech@dpw.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "gitpython==3.2.1",
    "pre-commit==4.7.0",
    "pygithub==2.10.0",
]

[project.scripts]
gimmegit = "gimmegit._cli:main"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "ty==0.0.89",
    "zizmor==1.31.1",
]

[build-system]
requires = [
    "uv_build==0.13.3",
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
