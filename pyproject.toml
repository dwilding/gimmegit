[project]
name = "gimmegit"
version = "3.0.4.dev0"
description = "A tool for cloning GitHub repos and creating branches."
authors = [
    { name = "Dave Wilding", email = "tech@dpw.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "gitpython==3.1.62",
    "pre-commit==4.6.2",
    "pygithub==2.10.0",
    # Dependencies of PyGithub. Specified because of security advisories.
    "pyjwt[crypto]==2.14.0",
    "cryptography==50.0.1",
    "requests==2.34.2",
]

[project.scripts]
gimmegit = "gimmegit._cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.7",
    "pytest==9.1.1",
    "ty==0.0.80",
    "zizmor==1.30.1",
]

[build-system]
requires = [
    "uv_build==0.12.13",
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
